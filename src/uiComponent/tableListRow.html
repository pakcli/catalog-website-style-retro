<!-- Mode 3: Table List Row (Tabular ledger row, <=60/72 cols, compact actions) -->
<tr class="table-list-row" data-app-slug="{{slug}}" data-tags="{{tagsJoined}}" data-category="{{category}}">
  <td class="col-name">
    <a href="{{playgroundUrl}}" class="table-item-link" title="{{title}}">
      <span class="prompt-sym">&gt;_</span>
      <span class="item-filename">{{slug}}.html</span>
    </a>
  </td>
  <td class="col-category">
    <span class="cat-pill">{{categoryTruncated}}</span>
  </td>
  <td class="col-actions">
    <div class="row-action-btns">
      <a href="{{playgroundUrl}}" class="btn-micro" title="Play">Play</a>
      <a href="{{downloadUrl}}" download class="btn-micro" title="Download">DL</a>
    </div>
  </td>
</tr>
