<!-- Shared Hero Telemetry & 3.5" Floppy Diskette Layout Shell (45° corner cut) -->
<header class="arcade-hero">
  <div class="hero-floppy-wrap">
    <div class="hero-floppy-shell">
      <div class="floppy-top-bezel">
        <div class="write-protect-window"></div>
        <div class="drive-label">DRIVE A:\ {{contextUpper}}</div>
        <div class="shutter-plate"></div>
      </div>
      <div class="floppy-corner-cut"></div>
      <div class="hero-body">
        <h1 class="hero-title">{{heroTitle}}</h1>
        <p class="hero-desc">{{heroDesc}}</p>
      </div>
    </div>
  </div>

  <div class="hero-metrics-grid">
    <div class="metric-box">
      <span class="metric-label">{{contextUpper}} LOADED</span>
      <span class="metric-val" id="heroAppsLoadedVal">{{totalItems}}</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">TIME WIB</span>
      <span class="metric-val" id="heroTimeVal">14:00</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">ACCENT</span>
      <span class="metric-val" id="heroAccentVal">RETRO OLIVE</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">GITHUB</span>
      <a href="https://github.com/fadhlisl/fadhlisl-my-id" target="_blank" rel="noopener noreferrer" class="metric-val metric-link">REPO ↗</a>
    </div>
  </div>
</header>
