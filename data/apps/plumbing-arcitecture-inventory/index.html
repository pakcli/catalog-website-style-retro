<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plumbing Architecture & Inventory Tracker</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eef2f5;
  --card: #ffffff;
  --card-sub: #f6f9fb;
  --tx: #13222a;
  --mu: #5a6e7c;
  --bd: #d0dce4;
  --ac: #007799;
  --ac-hover: #005f7a;
  --ac-sub: #e1f3f8;
  --ok: #15803d;
  --ok-bg: #eafaf1;
  --bad: #b91c1c;
  --bad-bg: #fdf2f2;
  --wn: #b45309;
  --wn-bg: #fffbeb;
  --cold: #0284c7;
  --hot: #e11d48;
  --drain: #78716c;
  --vent: #0d9488;
  --focus: #38bdf8;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1419;
    --card: #152028;
    --card-sub: #1b2832;
    --tx: #e7eff3;
    --mu: #8c9fae;
    --bd: #263845;
    --ac: #38bdf8;
    --ac-hover: #0ea5e9;
    --ac-sub: #113042;
    --ok: #4ade80;
    --ok-bg: #143522;
    --bad: #f87171;
    --bad-bg: #3f1919;
    --wn: #fbbf24;
    --wn-bg: #382c11;
    --cold: #38bdf8;
    --hot: #fb7185;
    --drain: #a8a29e;
    --vent: #2dd4bf;
    --shadow: 0 2px 4px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 20px rgba(0,0,0,0.6);
  }
}

:root[data-theme="dark"] {
  --bg: #0c1419;
  --card: #152028;
  --card-sub: #1b2832;
  --tx: #e7eff3;
  --mu: #8c9fae;
  --bd: #263845;
  --ac: #38bdf8;
  --ac-hover: #0ea5e9;
  --ac-sub: #113042;
  --ok: #4ade80;
  --ok-bg: #143522;
  --bad: #f87171;
  --bad-bg: #3f1919;
  --wn: #fbbf24;
  --wn-bg: #382c11;
  --cold: #38bdf8;
  --hot: #fb7185;
  --drain: #a8a29e;
  --vent: #2dd4bf;
  --shadow: 0 2px 4px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 20px rgba(0,0,0,0.6);
}

:root[data-theme="light"] {
  --bg: #eef2f5;
  --card: #ffffff;
  --card-sub: #f6f9fb;
  --tx: #13222a;
  --mu: #5a6e7c;
  --bd: #d0dce4;
  --ac: #007799;
  --ac-hover: #005f7a;
  --ac-sub: #e1f3f8;
  --ok: #15803d;
  --ok-bg: #eafaf1;
  --bad: #b91c1c;
  --bad-bg: #fdf2f2;
  --wn: #b45309;
  --wn-bg: #fffbeb;
  --cold: #0284c7;
  --hot: #e11d48;
  --drain: #78716c;
  --vent: #0d9488;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 960px;
  margin: 0 auto;
  padding: 14px 16px 40px;
}

/* App Header & Top Bar */
header.app-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 12px;
  flex-wrap: wrap;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-title h1 {
  font-size: 1.35rem;
  margin: 0;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.brand-title .badge {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--ac-sub);
  color: var(--ac);
  border: 1px solid var(--ac);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Stats Pill Bar */
.stats-banner {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.stat-pill {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 8px 12px;
  box-shadow: var(--shadow);
}
.stat-pill .lbl {
  font-size: 0.75rem;
  color: var(--mu);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  font-weight: 600;
}
.stat-pill .val {
  font-size: 1.15rem;
  font-weight: 700;
  margin-top: 2px;
}

/* Tabs Nav */
nav.tab-nav {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}
nav.tab-nav button {
  flex: 0 0 auto;
  padding: 8px 14px;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 8px;
  font: inherit;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all 0.15s ease;
}
nav.tab-nav button:hover {
  background: var(--card-sub);
  border-color: var(--ac);
}
nav.tab-nav button.on {
  background: var(--ac);
  color: #ffffff;
  border-color: var(--ac);
  box-shadow: 0 2px 5px rgba(0,119,153,0.3);
}

/* Cards & Containers */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}
.card-title {
  font-weight: 700;
  font-size: 1.05rem;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-sub {
  background: var(--card-sub);
  border: 1px dashed var(--bd);
  border-radius: 8px;
  padding: 10px;
  margin: 8px 0;
}

/* Typography & Layout Utilities */
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.g3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.mu { color: var(--mu); font-size: 0.88rem; }
.sm { font-size: 0.8rem; }
.nowrap { white-space: nowrap; }

/* Form Controls */
input, select, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 8px 10px;
  border: 1px solid var(--bd);
  border-radius: 7px;
  background: var(--bg);
  color: var(--tx);
  font: inherit;
  margin: 4px 0;
  transition: border-color 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 2px var(--ac-sub);
}

/* Buttons */
button { font-family: inherit; cursor: pointer; }
button.b {
  padding: 8px 14px;
  border: 0;
  border-radius: 7px;
  background: var(--ac);
  color: #fff;
  font-weight: 600;
  font-size: 0.9rem;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s ease;
}
button.b:hover { background: var(--ac-hover); }
button.s {
  padding: 6px 12px;
  border: 1px solid var(--bd);
  border-radius: 7px;
  background: var(--card);
  color: var(--tx);
  font-size: 0.85rem;
  font-weight: 500;
  transition: all 0.15s ease;
}
button.s:hover {
  background: var(--card-sub);
  border-color: var(--mu);
}
button.x {
  border: 0;
  background: none;
  color: var(--bad);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 4px 6px;
  border-radius: 5px;
}
button.x:hover { background: var(--bad-bg); }
button.icon-btn {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 7px;
  padding: 6px 10px;
  color: var(--tx);
  font-size: 0.9rem;
}

/* Badges & Tags */
.badge-chip {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 5px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-cold { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
.badge-hot { background: #ffe4e6; color: #be123c; border: 1px solid #fecdd3; }
.badge-drain { background: #f5f5f4; color: #44403c; border: 1px solid #d6d3d1; }
.badge-vent { background: #ccfbf1; color: #0f766e; border: 1px solid #99f6e4; }
.badge-ok { background: var(--ok-bg); color: var(--ok); }
.badge-bad { background: var(--bad-bg); color: var(--bad); }
.badge-wn { background: var(--wn-bg); color: var(--wn); }

.tag { font-weight: 700; margin-right: 6px; }
.add { color: var(--ok); }
.rem { color: var(--bad); }
.chg { color: var(--wn); }
.ok { color: var(--ok); font-weight: 600; }
.bad { color: var(--bad); font-weight: 600; }

/* Interactive SVG Diagram */
.diagram-wrap {
  width: 100%;
  background: var(--card-sub);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 12px;
  margin: 10px 0;
  overflow-x: auto;
}
.diagram-svg {
  width: 100%;
  max-width: 900px;
  height: auto;
  display: block;
  margin: 0 auto;
}
.diagram-node {
  cursor: pointer;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.diagram-node:hover {
  filter: drop-shadow(0 2px 6px rgba(0,119,153,0.4));
}
.diagram-legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 0.8rem;
  margin-top: 8px;
  color: var(--mu);
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
}

/* Modal Window */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  z-index: 1000;
  backdrop-filter: blur(2px);
}
.modal-box {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 12px;
  max-width: 540px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 18px;
  box-shadow: var(--shadow-lg);
}

/* Checklist / Shopping Mode */
.shop-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--bd);
  transition: background 0.1s ease;
}
.shop-item:hover { background: var(--card-sub); }
.shop-item.checked {
  text-decoration: line-through;
  opacity: 0.55;
}
.shop-item input[type="checkbox"] {
  width: auto;
  margin: 0;
  cursor: pointer;
}

/* Responsive Table */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 8px 0;
  font-size: 0.9rem;
}
.data-table th, .data-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--bd);
  text-align: left;
}
.data-table th {
  background: var(--card-sub);
  color: var(--mu);
  font-weight: 600;
  font-size: 0.8rem;
  text-transform: uppercase;
}

@media print {
  body { background: #fff; color: #000; }
  nav.tab-nav, .header-actions, button { display: none !important; }
  .card { border: 1px solid #ccc; box-shadow: none; break-inside: avoid; }
}
</style>
</head>
<body>
<main>

<header class="app-hdr">
  <div class="brand-title">
    <h1>🚰 Plumbing Architecture & Inventory</h1>
    <span class="badge">PRO v2.5</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme" id="theme-btn">🌓 Theme</button>
  </div>
</header>

<div class="stats-banner" id="stats-banner">
  <!-- Populated dynamically -->
</div>

<nav class="tab-nav" id="nav"></nav>

<div id="app"></div>

<div id="modal-root"></div>

</main>

<script>
var KEY = "plumbing-tracker-v1";
var S;

function uid() {
  return Math.random().toString(36).slice(2, 9);
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function esc(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function $(id) {
  return document.getElementById(id);
}

/* Theme Controller */
function initTheme() {
  var saved = localStorage.getItem("plumbing-theme");
  if (saved) {
    document.documentElement.setAttribute("data-theme", saved);
  }
}

function toggleTheme() {
  var cur = document.documentElement.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("plumbing-theme", next);
}

/* Realistic Plumbing System Seed */
function seed() {
  var p1 = uid(), p2 = uid(), p3 = uid(), p4 = uid(), p5 = uid(), p6 = uid(), p7 = uid(), p8 = uid(), p9 = uid(), p10 = uid();
  var v1 = uid(), v2 = uid();

  return {
    tab: "schematic",
    sel: v2,
    ca: v1,
    cb: v2,
    shoppingChecked: {},
    activeZoneFilter: "all",
    parts: [
      { id: p1, name: "Full Port Ball Valve", category: "Valves", material: "Brass", size: "3/4 in", model: "Apollo Lead-Free NPT", owned: 4, minStock: 2, unitCost: 16.50, bin: "Shelf A-1" },
      { id: p2, name: "PEX-A Tubing (Cold)", category: "Pipes", material: "PEX-A", size: "3/4 in (100ft)", model: "Uponor AquaPEX Blue", owned: 2, minStock: 1, unitCost: 48.00, bin: "Rack 3" },
      { id: p3, name: "PEX-A Tubing (Hot)", category: "Pipes", material: "PEX-A", size: "1/2 in (100ft)", model: "Uponor AquaPEX Red", owned: 2, minStock: 1, unitCost: 39.50, bin: "Rack 3" },
      { id: p4, name: "90° Elbow Expansion", category: "Fittings", material: "Brass / PPSU", size: "3/4 in", model: "ProPEX Expansion", owned: 14, minStock: 5, unitCost: 2.75, bin: "Bin F-2" },
      { id: p5, name: "90° Elbow Expansion", category: "Fittings", material: "Brass / PPSU", size: "1/2 in", model: "ProPEX Expansion", owned: 20, minStock: 8, unitCost: 1.85, bin: "Bin F-3" },
      { id: p6, name: "Reducing Tee 3/4 x 3/4 x 1/2", category: "Fittings", material: "PPSU", size: "3/4 x 1/2 in", model: "ProPEX Tee", owned: 8, minStock: 4, unitCost: 3.20, bin: "Bin F-5" },
      { id: p7, name: "Pressure Reducing Valve (PRV)", category: "Valves", material: "Cast Bronze", size: "3/4 in", model: "Watts LF25AUB-Z3 50PSI", owned: 1, minStock: 1, unitCost: 89.00, bin: "Shelf A-3" },
      { id: p8, name: "Dual Stage Sediment/Carbon Filter", category: "Treatment", material: "Composite", size: "3/4 in Port", model: "Pentair 10-inch Big Blue", owned: 1, minStock: 1, unitCost: 119.00, bin: "Station 1" },
      { id: p9, name: "Sanitary P-Trap Kit", category: "Drain & DWV", material: "PVC Sch 40", size: "1-1/2 in", model: "Charlotte Pipe Slip-Joint", owned: 5, minStock: 2, unitCost: 7.50, bin: "Shelf D-1" },
      { id: p10, name: "Quarter-Turn Angle Stop", category: "Valves", material: "Chrome Brass", size: "1/2 in Nom x 3/8 in OD", model: "BrassCraft Compression", owned: 8, minStock: 4, unitCost: 8.25, bin: "Bin V-1" }
    ],
    versions: [
      {
        id: v1,
        name: "v1 Original As-Built (Copper/Mix)",
        date: "2024-01-15",
        status: "Archived",
        author: "Original Installer",
        note: "Legacy baseline supply with basic main shutoff and single filter.",
        items: [
          { loc: "Main Water Inflow", sys: "Cold", partId: p1, qty: 1, note: "Street main shutoff" },
          { loc: "Main Inflow Filter", sys: "Treatment", partId: p8, qty: 1, note: "Whole house sediment" },
          { loc: "Kitchen Sink Cold", sys: "Cold", partId: p10, qty: 1, note: "Angle stop" },
          { loc: "Kitchen Sink Hot", sys: "Hot", partId: p10, qty: 1, note: "Angle stop" },
          { loc: "Kitchen Sink Drain", sys: "Drain", partId: p9, qty: 1, note: "Trap" },
          { loc: "Master Bath Lavatory", sys: "Cold", partId: p10, qty: 2, note: "Dual shutoffs" }
        ]
      },
      {
        id: v2,
        name: "v2 PEX Manifold & PRV Modernization",
        date: today(),
        status: "As-Built",
        author: "Lead Master Plumber",
        note: "Added Watts PRV, Dedicated 3/4 trunk loops, Uponor ProPEX runs, and dual bathroom feeds.",
        items: [
          { loc: "Water Main Meter Inlet", sys: "Cold", partId: p1, qty: 1, note: "Main brass gate replacement" },
          { loc: "Pressure Regulator Station", sys: "Cold", partId: p7, qty: 1, note: "Calibrated to 55 PSI" },
          { loc: "Whole House Filtration", sys: "Treatment", partId: p8, qty: 1, note: "Dual-stage pre-filter" },
          { loc: "Cold Supply Main Trunk", sys: "Cold", partId: p2, qty: 1, note: "75ft 3/4 trunk" },
          { loc: "Hot Supply Main Trunk", sys: "Hot", partId: p3, qty: 1, note: "60ft 1/2 distribution" },
          { loc: "Water Heater Isolation", sys: "Cold", partId: p1, qty: 2, note: "Inlet & outlet service valves" },
          { loc: "Manifold Branch Takeoffs", sys: "Cold", partId: p6, qty: 6, note: "Run to baths & kitchen" },
          { loc: "Kitchen Sink Riser Corner", sys: "Cold", partId: p4, qty: 4, note: "Riser bends" },
          { loc: "Kitchen Sink Under-Cabinet", sys: "Cold", partId: p10, qty: 2, note: "Hot & cold stops" },
          { loc: "Kitchen DWV Under-Counter", sys: "Drain", partId: p9, qty: 1, note: "1-1/2 sanitary P-trap" },
          { loc: "Master Bath Vanity Riser", sys: "Cold", partId: p5, qty: 6, note: "1/2 expansion elbows" },
          { loc: "Master Bath Vanity Stops", sys: "Cold", partId: p10, qty: 2, note: "Double vanity feeds" },
          { loc: "Guest Bath Vanity Stops", sys: "Cold", partId: p10, qty: 2, note: "Stop valves" },
          { loc: "Master Bath DWV Drain", sys: "Drain", partId: p9, qty: 2, note: "Shower & sink traps" }
        ]
      }
    ],
    maintenanceLogs: [
      { id: uid(), date: today(), task: "Main Shutoff Valve Full Exercise", zone: "Utility Room", status: "Done", notes: "Rotated 90° smoothly, zero weeping." },
      { id: uid(), date: "2026-09-10", task: "Whole House Carbon Filter Cartridge Replacement", zone: "Filter Bay", status: "Done", notes: "Flushed 5 gallons before tie-in." },
      { id: uid(), date: "2026-12-01", task: "Water Heater Anode Rod Inspection & Sediment Flush", zone: "Water Heater", status: "Scheduled", notes: "Check magnesium rod wear." }
    ]
  };
}

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.parts) && Array.isArray(d.versions) && d.versions.length) {
        if (!d.shoppingChecked) d.shoppingChecked = {};
        if (!d.maintenanceLogs) d.maintenanceLogs = [];
        return d;
      }
    }
  } catch (e) {
    console.warn("Storage load fallback:", e);
  }
  return seed();
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {
    console.error("Save error:", e);
  }
}

function latest() {
  return S.versions[S.versions.length - 1];
}

function curV() {
  return S.versions.find(function(v) { return v.id === S.sel; }) || latest();
}

/* In-use quantity count cross-referenced to active version */
function used(id) {
  var v = curV();
  return v.items.filter(function(i) { return i.partId === id; })
                .reduce(function(acc, i) { return acc + (parseInt(i.qty) || 0); }, 0);
}

function getPart(id) {
  return S.parts.find(function(x) { return x.id === id; });
}

function pn(id) {
  var p = getPart(id);
  if (!p) return "Deleted Component";
  var extra = [];
  if (p.size) extra.push(p.size);
  if (p.material) extra.push(p.material);
  return p.name + (extra.length ? " (" + extra.join(" · ") + ")" : "");
}

function setTab(t) {
  S.tab = t;
  save();
  render();
}

/* Part Operations */
function addPart() {
  var name = $("p-name").value.trim();
  if (!name) {
    alert("Please enter a part name.");
    return;
  }
  var cat = $("p-cat").value;
  var mat = $("p-mat").value.trim();

/* Version Diff Engine */
function setCmp(k, v) {
  S[k] = v;
  save();
  render();
}

function keyed(v) {
  var m = {}, c = {};
  v.items.forEach(function(i) {
    var base = (i.loc || "").toLowerCase().trim();
    c[base] = (c[base] || 0) + 1;
    m[base + "#" + c[base]] = i;
  });
  return m;
}

function diff(a, b) {
  var A = keyed(a), B = keyed(b), out = [], same = 0, costDelta = 0;
  Object.keys(B).forEach(function(k) {
    var x = A[k], y = B[k];
    var py = getPart(y.partId);
    var cy = py ? (py.unitCost || 0) * y.qty : 0;
    if (!x) {
      out.push(["add", "Added", y.loc, (y.sys ? "[" + y.sys + "] " : "") + pn(y.partId) + " ×" + y.qty + (y.note ? " — " + y.note : "")]);
      costDelta += cy;
    } else if (x.partId !== y.partId || x.qty !== y.qty || x.sys !== y.sys) {
      var px = getPart(x.partId);
      var cx = px ? (px.unitCost || 0) * x.qty : 0;
      out.push(["chg", "Changed", y.loc, pn(x.partId) + " ×" + x.qty + " → " + pn(y.partId) + " ×" + y.qty]);
      costDelta += (cy - cx);
    } else {
      same++;
    }
  });

  /* FIXED: Correct syntax without double closing brackets */
  Object.keys(A).forEach(function(k) {
    if (!B[k]) {
      var px = getPart(A[k].partId);
      var cx = px ? (px.unitCost || 0) * A[k].qty : 0;
      out.push(["rem", "Removed", A[k].loc, pn(A[k].partId) + " ×" + A[k].qty]);
      costDelta -= cx;
    }
  });

  return { out: out, same: same, costDelta: costDelta };
}

    return '<option value="' + v.id + '"' + (v.id === sel ? ' selected' : '') + '>' +

function copyShoppingList() {
  var list = getShoppingData().missing;
  if (!list.length) {
    alert("Good news! You have all required parts in stock. Nothing to buy!");
    return;
  }
  var txt = "🛒 PLUMBING PROCUREMENT SHOPPING LIST (" + curV().name + ")\n" +
            "Generated: " + today() + "\n" +
            "====================================================\n\n";
  var total = 0;
  list.forEach(function(item, idx) {
    var subtotal = item.needed * item.part.unitCost;
    total += subtotal;
    txt += (idx + 1) + ". [ ] " + item.part.name + " (" + (item.part.size || "") + " " + (item.part.material || "") + ")\n" +
           "   Needed: " + item.needed + " units | Owned: " + item.part.owned + " | Est: $" + subtotal.toFixed(2) + "\n";
  });
  txt += "\n====================================================\n" +
         "TOTAL ESTIMATED BUDGET: $" + total.toFixed(2);

  navigator.clipboard.writeText(txt).then(function() {
    alert("Shopping list copied to clipboard!");
  }).catch(function() {
    prompt("Copy shopping list:", txt);
  });
}

function getShoppingData() {
  var v = curV();
  var reqMap = {};
  v.items.forEach(function(i) {
    reqMap[i.partId] = (reqMap[i.partId] || 0) + (parseInt(i.qty) || 0);
  });

  var missing = [];
  var allReq = [];
  var totalEstCost = 0;

  Object.keys(reqMap).forEach(function(pid) {
    var p = getPart(pid) || { id: pid, name: "Unknown Part", owned: 0, unitCost: 0 };
    var needed = reqMap[pid];
    var owned = p.owned || 0;
    var shortage = Math.max(0, needed - owned);
    var item = {
      part: p,
      required: needed,
      owned: owned,
      needed: shortage,
      cost: shortage * (p.unitCost || 0)
    };
    allReq.push(item);
    if (shortage > 0) {
      missing.push(item);
      totalEstCost += item.cost;
    }
  });

  return { missing: missing, all: allReq, totalEstCost: totalEstCost };
}

/* Calculators */
function calcWSFU() {
  var lav = parseInt($("wsfu-lav").value) || 0;
  var wc = parseInt($("wsfu-wc").value) || 0;
  var shower = parseInt($("wsfu-shower").value) || 0;
  var sink = parseInt($("wsfu-sink").value) || 0;
  var dw = parseInt($("wsfu-dw").value) || 0;
  var wash = parseInt($("wsfu-wash").value) || 0;
  var hose = parseInt($("wsfu-hose").value) || 0;

  var total = (lav * 1.0) + (wc * 2.2) + (shower * 2.0) + (sink * 1.5) + (dw * 1.5) + (wash * 2.0) + (hose * 2.5);
  $("wsfu-total").textContent = total.toFixed(1);

  var rec = "3/4 inch Supply Trunk";
  if (total > 28) rec = "1-1/4 inch Main Supply Line";
  else if (total > 14) rec = "1 inch Main Supply Line";
  else if (total < 6) rec = "1/2 inch Supply Line (Small / Cabin)";
  $("wsfu-rec").textContent = rec;
}

function calcPipeVol() {
  var dia = parseFloat($("pvol-dia").value) || 0.75;
  var len = parseFloat($("pvol-len").value) || 50;

  var radiusInches = dia / 2;
  var volCubicInches = Math.PI * Math.pow(radiusInches, 2) * (len * 12);
  var gal = volCubicInches / 231;
  var liters = gal * 3.78541;
  var waitSec = (gal / 1.5) * 60; // based on 1.5 GPM standard shower/faucet

  $("pvol-gal").textContent = gal.toFixed(2) + " gal (" + liters.toFixed(2) + " L)";
  $("pvol-wait").textContent = Math.round(waitSec) + " seconds";
}

    // Pipe volume & water retention calculator
    h += '<div class="card">' +
      '<h3 class="card-title">📏 Pipe Run Volume & Purge Wait Calculator</h3>' +
      '<div class="mu sm" style="margin-bottom:10px">Calculate water volume held inside a pipe run to predict hot water delivery delay and winterization drain volumes.</div>' +
      '<div class="g2">' +
        '<div><label class="sm mu">Inner Diameter</label><select id="pvol-dia" onchange="calcPipeVol()">' +
          '<option value="0.5">1/2 in (PEX-A / Copper)</option>' +
          '<option value="0.75" selected>3/4 in Trunk</option>' +
          '<option value="1.0">1 in Main Supply</option>' +
          '<option value="1.5">1-1/2 in Drain</option>' +
          '<option value="2.0">2 in Waste Branch</option>' +
          '<option value="3.0">3 in Main Soil Stack</option>' +
        '</select></div>' +
        '<div><label class="sm mu">Run Length (Feet)</label><input id="pvol-len" type="number" min="1" value="45" oninput="calcPipeVol()"></div>' +
      '</div>' +
      '<div class="card-sub">' +
        '<div class="row">' +
          '<div><span class="mu sm">Internal Water Volume:</span> <b id="pvol-gal" style="color:var(--ac)">1.03 gal (3.91 L)</b></div>' +
          '<div><span class="mu sm">Hot Water Delay (at 1.5 GPM):</span> <b id="pvol-wait" class="wn">41 seconds</b></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* -------------------------------------------------------------
     TAB 7: MAINTENANCE & INSPECTION LOG
  ------------------------------------------------------------- */
  if (S.tab === "maintenance") {
    h += '<div class="card">' +
      '<h3 class="card-title">+ Log Plumbing Maintenance / Inspection</h3>' +
      '<div class="g2">' +
        '<div><label class="sm mu">Task Name</label><input id="m-task" placeholder="e.g. Exercise Main Ball Valve, Replace Carbon Filter"></div>' +
        '<div><label class="sm mu">Zone / Equipment</label><input id="m-zone" placeholder="e.g. Utility Room, Water Heater Bay"></div>' +
      '</div>' +
      '<div class="g3">' +
        '<div><label class="sm mu">Date</label><input id="m-date" type="date" value="' + today() + '"></div>' +
        '<div><label class="sm mu">Status</label><select id="m-status"><option value="Done">✓ Completed</option><option value="Scheduled">⏳ Scheduled</option><option value="Attention">⚠️ Needs Attention</option></select></div>' +
        '<div><label class="sm mu">Technician / Owner</label><input id="m-tech" placeholder="e.g. Self / Licensed Plumber"></div>' +
      '</div>' +
      '<div><label class="sm mu">Inspection Notes</label><input id="m-notes" placeholder="e.g. Flushed sediment for 3 minutes, pressure gauge stable at 54 PSI"></div>' +
      '<div style="margin-top:8px"><button class="b" onclick="addMaintLog()">Record Maintenance Log</button></div>' +
    '</div>';

    h += '<div class="card">' +
      '<h3 class="card-title">Maintenance History & Schedule (' + (S.maintenanceLogs ? S.maintenanceLogs.length : 0) + ')</h3>';

    if (!S.maintenanceLogs || !S.maintenanceLogs.length) {
      h += '<p class="mu">No maintenance events recorded yet.</p>';
    } else {
      S.maintenanceLogs.forEach(function(m) {
        var statusBadge = m.status === 'Done' ? 'badge-ok' : (m.status === 'Attention' ? 'badge-bad' : 'badge-wn');
        h += '<div class="row" style="padding:10px 0;border-bottom:1px solid var(--bd)">' +
          '<div>' +
            '<div style="font-weight:700">' + esc(m.task) + ' <span class="badge-chip ' + statusBadge + '">' + esc(m.status) + '</span></div>' +
            '<div class="mu sm">📅 ' + esc(m.date) + ' · 📍 ' + esc(m.zone) + (m.notes ? ' — ' + esc(m.notes) : '') + '</div>' +
          '</div>' +
          '<button class="x" onclick="delMaintLog(\'' + m.id + '\')">Remove</button>' +
        '</div>';
      });
    }
    h += '</div>';
  }

  /* -------------------------------------------------------------
     TAB 8: BACKUP, PRESETS & DATA PORTABILITY
  ------------------------------------------------------------- */
  if (S.tab === "backup") {
    h += '<div class="card">' +
      '<h3 class="card-title">Quick Starter Presets</h3>' +
      '<div class="mu sm" style="margin-bottom:10px">Preload complete real-world architectures to explore or use as templates:</div>' +
      '<div class="g2">' +
        '<button class="s" style="padding:10px;text-align:left" onclick="loadPreset(\'default\')">' +
          '<b>🏠 Residential 2-Story (Full PEX-A)</b>' +
          '<div class="mu sm">Trunk & branch, PRV, filtration, dual bath.</div>' +
        '</button>' +
        '<button class="s" style="padding:10px;text-align:left" onclick="loadPreset(\'tinyhouse\')">' +
          '<b>🚐 Off-Grid RV / Tiny House</b>' +
          '<div class="mu sm">12V Shurflo pump, 33 gal tank, accumulator.</div>' +
        '</button>' +
      '</div>' +
    '</div>';

    h += '<div class="card">' +
      '<div class="card-header">' +
        '<div><h3 class="card-title">JSON Data Backup & Portability</h3><div class="mu sm">All data resides in your browser localStorage</div></div>' +
        '<div class="row">' +
          '<button class="b" onclick="downloadBackupJson()">💾 Download .json</button>' +
          '<button class="s" onclick="exportCsv()">📊 Export CSV</button>' +
        '</div>' +
      '</div>' +
      '<textarea id="b-box" rows="8" placeholder="Paste JSON backup text here or click Show Backup"></textarea>' +
      '<div class="row" style="margin-top:8px">' +
        '<button class="s" onclick="exportB()">Show JSON Text</button>' +
        '<button class="b" onclick="restoreB()">Restore from JSON</button>' +
      '</div>' +
    '</div>';
  }

  $("app").innerHTML = h;
}

// Initial boot
S = load();
render();
</script>
</body>
</html>
