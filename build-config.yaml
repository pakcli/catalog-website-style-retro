# ==============================================================================
# build-config.yaml - Active Build Configuration
# ==============================================================================

app:
  name: "Retro IT Knowledge Arcade"
  version: "1.0.0"
  theme_default: "vintage-computer"

sources:
  assets:  "./data/assets"
  apps:    "./data/apps"
  docs:    "./data/docs"
  scripts: "./data/scripts"
  combos:  "./data/combos"
  skills:  "./data/skills"

compiler:
  standalone_suffix: "_standalone"
  inline_adapters: true
  minify_html: false
  generate_sourcemaps: false

privacy:
  mask_default_state: true
  allowed_domains_whitelist:
    - "github.com"
    - "raw.githubusercontent.com"
    - "users.noreply.github.com"

deployment:
  output_dir: "./public"
  target_remote: "origin"
  target_branch: "gh-pages"
  cname: ""
  base_url: "./"
